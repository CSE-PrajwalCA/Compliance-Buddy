<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Compliance Buddy Test</title>
  <style>
    .control { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>ISO 27001 Checklist</h2>

  <div class="control" id="control-1">
    Do you have an information security policy?
    <br><input type="file" />
  </div>

  <div class="control" id="control-2">
    Is sensitive data encrypted at rest and in transit?
    <br><input type="file" />
  </div>

  <div class="control" id="control-3">
    Do you conduct periodic access control reviews?
    <br><input type="file" />
  </div>
</body>
</html>
